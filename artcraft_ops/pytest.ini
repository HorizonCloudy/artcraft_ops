[pytest]
# 【位置很重要】本文件必须放在插件根（artcraft_ops/），不能放 tests/。
# 裸跑 `pytest` 时 rootdir = 插件根，pytest 只从 rootdir 向上找 ini；
# 放 tests/ 里只有显式 `pytest tests/` 才会被加载 —— 那样
# asyncio_default_fixture_loop_scope 与 markers 全部静默失效（历史坑，已修）。

# 本套件不使用 pytest-asyncio 的 async 测试：所有异步调用一律用 asyncio.run() 包装，
# 以便跨 Python 3.13 / 3.14 与 pytest 9.1 / 9.2 零配置可跑。
# 下面这行只为消除 pytest-asyncio 1.x 的 asyncio_default_fixture_loop_scope 弃用警告。
asyncio_default_fixture_loop_scope = function

markers =
    integration: 需要本机真实 photocraft-cli.exe 的端到端冒烟（默认 skip）

# marker 拼错/漏注册一律报错，不静默放行（与仓库「fail-closed」口径一致）
addopts = --strict-markers

# 裸跑只收 tests/，避免误扫插件根下的其他目录
testpaths = tests

# 不让 pytest 去收集 _fixtures.py（它以下划线开头，默认也不会被收集，这里显式声明）
python_files = test_*.py
